<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">
            Laundry Wallah
        </div>

        <!-- Desktop Navigation -->
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </div>

        <!-- Username -->
        <button class="username">
            Username
        </button>

        <!-- Hamburger Button -->
        <button class="hamburger">
            ☰
        </button>

        <!-- Mobile Menu -->
        <div class="mobile-menu">

            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>

        </div>

    </nav>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Revitalize Your<br>
                Clothes with Expert<br>
                <span>Laundry Services!</span>
            </h1>

            <p>
                From premium dry cleaning to swift wash and fold,
                we deliver care and convenience. Schedule a pickup
                and rediscover the freshness of your clothes today!
            </p>

            <button class="service-btn">
                Book a service today!
            </button>

        </div>

        <div class="hero-image">
            <img
                src="https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?auto=format&fit=crop&w=600&q=80"
                alt="Laundry Service"
            >
        </div>

    </section>

</body>
</html>
